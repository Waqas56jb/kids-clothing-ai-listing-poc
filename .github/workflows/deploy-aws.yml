name: Deploy AWS Lightsail

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'admin/**'
      - 'backend/app/**'
      - 'backend/ai_engine/**'
      - 'backend/db/**'
      - 'backend/scripts/**'
      - 'backend/requirements.txt'
      - 'backend/Dockerfile'
      - 'backend/.deploy/deploy_*.sh'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Force backend rebuild'
        type: boolean
        default: true
      deploy_frontends:
        description: 'Force frontend rebuild'
        type: boolean
        default: true

concurrency:
  group: deploy-aws-lightsail
  cancel-in-progress: true

env:
  # Same-origin /api via Caddy on each host (miniplagg.com / admin.miniplagg.com).
  API_URL: ''
  ADMIN_URL: https://admin.miniplagg.com
  CLIENT_URL: https://miniplagg.com

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'client/**'
              - 'admin/**'
              - 'backend/.deploy/deploy_frontends.sh'
              - '.github/workflows/deploy-aws.yml'
            backend:
              - 'backend/app/**'
              - 'backend/ai_engine/**'
              - 'backend/db/**'
              - 'backend/scripts/**'
              - 'backend/requirements.txt'
              - 'backend/Dockerfile'
              - 'backend/.deploy/deploy_backend.sh'

  deploy-frontends:
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_frontends) || (github.event_name == 'push' && needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            admin/package-lock.json

      - name: Build seller client
        working-directory: client
        env:
          VITE_API_URL: ${{ env.API_URL }}
          VITE_ADMIN_URL: ${{ env.ADMIN_URL }}
        run: |
          npm ci
          npm run build
          tar -czf ../client-dist.tar.gz -C dist .

      - name: Build admin
        working-directory: admin
        env:
          VITE_API_URL: ${{ env.API_URL }}
          VITE_CLIENT_URL: ${{ env.CLIENT_URL }}
        run: |
          npm ci
          npm run build
          tar -czf ../admin-dist.tar.gz -C dist .

      - name: Upload + deploy static sites
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST:-}" ] || [ -z "${USER:-}" ]; then
            echo "::error::Missing GitHub secrets LIGHTSAIL_SSH_KEY, LIGHTSAIL_HOST, and/or LIGHTSAIL_USER"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          # Ensure scripts are Unix LF even if checked out from Windows
          sed -i 's/\r$//' backend/.deploy/deploy_frontends.sh
          chmod +x backend/.deploy/deploy_frontends.sh
          scp -i ~/.ssh/lightsail.pem \
            client-dist.tar.gz admin-dist.tar.gz backend/.deploy/deploy_frontends.sh \
            "$USER@$HOST:/tmp/"
          ssh -i ~/.ssh/lightsail.pem "$USER@$HOST" \
            'sed -i "s/\r$//" /tmp/deploy_frontends.sh && chmod +x /tmp/deploy_frontends.sh && sudo bash /tmp/deploy_frontends.sh'

  deploy-backend:
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_backend) || (github.event_name == 'push' && needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync backend + rebuild container
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST:-}" ] || [ -z "${USER:-}" ]; then
            echo "::error::Missing GitHub secrets LIGHTSAIL_SSH_KEY, LIGHTSAIL_HOST, and/or LIGHTSAIL_USER"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          mkdir -p /tmp/kids-ai-bundle
          # Prefer plain cp — rsync is not always on the runner image.
          cp -a backend/app backend/ai_engine backend/db backend/scripts \
            backend/requirements.txt backend/Dockerfile \
            /tmp/kids-ai-bundle/

          tar -czf /tmp/kids-ai-bundle.tar.gz -C /tmp/kids-ai-bundle .
          sed -i 's/\r$//' backend/.deploy/deploy_backend.sh
          chmod +x backend/.deploy/deploy_backend.sh
          scp -i ~/.ssh/lightsail.pem \
            /tmp/kids-ai-bundle.tar.gz backend/.deploy/deploy_backend.sh \
            "$USER@$HOST:/tmp/"

          ssh -i ~/.ssh/lightsail.pem "$USER@$HOST" bash <<'REMOTE'
          set -euo pipefail
          sudo mkdir -p /opt/kids-ai
          sudo tar -xzf /tmp/kids-ai-bundle.tar.gz -C /opt/kids-ai
          sed -i 's/\r$//' /tmp/deploy_backend.sh
          chmod +x /tmp/deploy_backend.sh
          sudo bash /tmp/deploy_backend.sh
          REMOTE
